<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作台管理</title>
<style>
:root{--bg:#f3f5f7;--surface:#fff;--text:#17202a;--muted:#687383;--line:#d9dfe5;--accent:#176b57;--danger:#b42318;--warn:#9a6700}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,"Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-box{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:28px}.login-box h1{font-size:22px;margin:0 0 6px}.muted{color:var(--muted)}.field{margin:14px 0}.field label{display:block;font-weight:650;margin-bottom:5px}.input{width:100%;height:40px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 10px}.textarea{min-height:82px;padding:9px;resize:vertical}.btn{height:38px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 14px}.btn:hover{background:#eef2f4}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--danger);border-color:#e4b4b0}.btn.small{height:30px;padding:0 9px;font-size:12px}.wide{width:100%}.error{color:var(--danger);min-height:21px}
.admin{display:none;min-height:100vh}.top{height:62px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;position:sticky;top:0;z-index:5}.top strong{font-size:17px}.top-actions{margin-left:auto;display:flex;gap:8px}.layout{display:grid;grid-template-columns:210px minmax(0,1fr)}.side{height:calc(100vh - 62px);position:sticky;top:62px;background:var(--surface);border-right:1px solid var(--line);padding:12px}.tab-btn{width:100%;height:40px;border:0;border-radius:6px;background:transparent;text-align:left;padding:0 12px;margin:2px 0}.tab-btn.active{background:var(--accent);color:#fff}.main{padding:22px;min-width:0}.panel{display:none}.panel.active{display:block}.page-head{display:flex;align-items:center;gap:10px;margin-bottom:18px}.page-head h1{font-size:22px;margin:0}.page-head .actions{margin-left:auto;display:flex;gap:8px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.metric{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:18px}.metric b{font-size:26px;display:block}.metric span{color:var(--muted)}.box{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:16px;margin-top:14px}.box h2{font-size:16px;margin:0 0 12px}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar .input{max-width:300px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:7px;background:var(--surface)}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:12px;color:var(--muted);background:#f8f9fa}tr:last-child td{border-bottom:0}.site-cell{display:flex;align-items:center;gap:8px}.mini-icon{width:30px;height:30px;border-radius:5px;background:#edf1f3;display:grid;place-items:center}.url{max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}.tag{display:inline-block;border-radius:4px;background:#edf1f3;padding:2px 7px;font-size:12px}.tag.active{color:#087443;background:#e6f5ed}.tag.review{color:var(--warn);background:#fff5d6}.tag.dead{color:var(--danger);background:#fdeceb}.row-actions{display:flex;gap:5px}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.toggle{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:6px;padding:12px}.toggle input{width:18px;height:18px;accent-color:var(--accent)}.drop{border:1px dashed #9ea8b2;border-radius:7px;padding:22px;text-align:center}.preview{margin-top:12px;padding:12px;background:#f7f8f9;border-radius:6px;display:none}.preview b{margin-right:14px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:30;place-items:center;padding:18px}.modal.open{display:grid}.modal-card{background:var(--surface);border-radius:8px;width:min(540px,100%);max-height:90vh;overflow:auto;padding:20px}.modal-head{display:flex;align-items:center}.modal-head h2{margin:0;font-size:18px}.modal-head button{margin-left:auto}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.span2{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;right:20px;bottom:20px;background:#18202a;color:#fff;padding:10px 14px;border-radius:6px;display:none;z-index:50}.empty{text-align:center;color:var(--muted);padding:28px}
@media(max-width:800px){.layout{display:block}.side{position:static;height:auto;display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.tab-btn{min-width:max-content;width:auto}.main{padding:15px}.cards{grid-template-columns:repeat(2,1fr)}.settings-grid{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-wrap:wrap}.page-head .actions{margin-left:0;width:100%}.top{padding:0 14px}.top .back-label{display:none}}
@media(max-width:440px){.cards{grid-template-columns:1fr 1fr}.metric{padding:12px}.form-grid{display:block}.top-actions .btn:first-child{display:none}}
</style>
</head>
<body>
<section class="login" id="loginPage"><form class="login-box" id="loginForm"><h1>工作台管理</h1><p class="muted">使用管理员账号登录</p><div class="field"><label>账号</label><input class="input" id="loginUser" autocomplete="username" required></div><div class="field"><label>密码</label><input class="input" id="loginPass" type="password" autocomplete="current-password" required></div><div class="error" id="loginError"></div><button class="btn primary wide">登录</button></form></section>
<section class="admin" id="adminPage">
<header class="top"><strong>工作台管理</strong><div class="top-actions"><a class="btn" href="index.html" style="text-decoration:none;display:grid;place-items:center"><span class="back-label">返回前台</span></a><button class="btn" id="logoutBtn">退出</button></div></header>
<div class="layout">
<nav class="side" id="tabs">
<button class="tab-btn active" data-tab="dashboard">概览</button><button class="tab-btn" data-tab="sites">网站管理</button><button class="tab-btn" data-tab="categories">分类管理</button><button class="tab-btn" data-tab="settings">功能设置</button><button class="tab-btn" data-tab="links">链接状态</button><button class="tab-btn" data-tab="data">数据管理</button><button class="tab-btn" data-tab="account">账号设置</button>
</nav>
<main class="main">
<section class="panel active" id="dashboardPanel"><div class="page-head"><h1>概览</h1></div><div class="cards" id="metrics"></div><div class="box"><h2>数据说明</h2><p class="muted">前台与后台共用 nav_data_v5。链接检测由本地 PowerShell 脚本执行，后台读取检测报告。</p></div></section>
<section class="panel" id="sitesPanel"><div class="page-head"><h1>网站管理</h1><div class="actions"><button class="btn primary" id="addSiteBtn">新增网站</button></div></div><div class="toolbar"><input class="input" id="siteFilter" placeholder="搜索名称或网址"><select class="input" id="categoryFilter"></select></div><div class="table-wrap"><table><thead><tr><th>网站</th><th>分类</th><th>网址</th><th>状态</th><th>操作</th></tr></thead><tbody id="sitesBody"></tbody></table></div></section>
<section class="panel" id="categoriesPanel"><div class="page-head"><h1>分类管理</h1><div class="actions"><button class="btn primary" id="addCategoryBtn">新增分类</button></div></div><div class="table-wrap"><table><thead><tr><th>图标</th><th>名称</th><th>ID</th><th>网站数</th><th>操作</th></tr></thead><tbody id="categoriesBody"></tbody></table></div></section>
<section class="panel" id="settingsPanel"><div class="page-head"><h1>功能设置</h1></div><div class="box"><div class="settings-grid" id="settingsGrid"></div><div style="margin-top:14px"><button class="btn primary" id="saveSettingsBtn">保存设置</button></div></div></section>
<section class="panel" id="linksPanel"><div class="page-head"><h1>链接状态</h1><div class="actions"><label class="btn" style="display:grid;place-items:center">导入报告<input id="reportInput" type="file" accept=".json,application/json" hidden></label></div></div><div class="cards" id="linkMetrics"></div><div class="toolbar" style="margin-top:14px"><select class="input" id="statusFilter"><option value="">全部状态</option><option value="active">有效</option><option value="redirect">重定向</option><option value="review">待复核</option><option value="dead">失效</option><option value="unchecked">未检测</option></select></div><div class="table-wrap"><table><thead><tr><th>网站</th><th>状态</th><th>HTTP</th><th>最终网址</th><th>检测时间</th><th>操作</th></tr></thead><tbody id="linksBody"></tbody></table></div></section>
<section class="panel" id="dataPanel"><div class="page-head"><h1>数据管理</h1></div><div class="box"><h2>导入 Netscape 书签</h2><div class="drop"><input id="bookmarkInput" type="file" accept=".html,text/html"><p class="muted">选择浏览器导出的 HTML 书签文件。确认前会统计分类、新增、重复和跳过数量。</p></div><div class="preview" id="bookmarkPreview"></div></div><div class="box"><h2>JSON 备份</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="exportBtn">导出数据</button><label class="btn" style="display:grid;place-items:center">导入数据<input id="jsonInput" type="file" accept=".json,application/json" hidden></label><button class="btn danger" id="resetBtn">恢复默认数据</button></div></div></section>
<section class="panel" id="accountPanel"><div class="page-head"><h1>账号设置</h1></div><form class="box" id="accountForm" style="max-width:520px"><div class="field"><label>管理员账号</label><input class="input" id="accountUser" required></div><div class="field"><label>新密码</label><input class="input" id="accountPass" type="password" minlength="4" required></div><button class="btn primary">更新凭据</button></form></section>
</main></div></section>
<div class="modal" id="siteModal"><form class="modal-card" id="siteForm"><div class="modal-head"><h2 id="siteModalTitle">新增网站</h2><button class="btn small" type="button" data-close="siteModal">关闭</button></div><input id="siteId" type="hidden"><div class="form-grid"><div class="field"><label>名称</label><input class="input" id="siteName" required></div><div class="field"><label>图标或 Emoji</label><input class="input" id="siteIcon" maxlength="8"></div><div class="field span2"><label>网址</label><input class="input" id="siteUrl" type="url" required></div><div class="field"><label>分类</label><select class="input" id="siteCategory" required></select></div><div class="field"><label>状态</label><select class="input" id="siteStatus"><option value="unchecked">未检测</option><option value="active">有效</option><option value="redirect">重定向</option><option value="review">待复核</option><option value="dead">失效</option></select></div><div class="field span2"><label>描述</label><textarea class="input textarea" id="siteDesc"></textarea></div><div class="field"><label><input id="siteVisibility" type="checkbox" checked> 前台显示</label></div></div><div class="modal-actions"><button class="btn" type="button" data-close="siteModal">取消</button><button class="btn primary">保存</button></div></form></div>
<div class="modal" id="categoryModal"><form class="modal-card" id="categoryForm"><div class="modal-head"><h2 id="categoryModalTitle">新增分类</h2><button class="btn small" type="button" data-close="categoryModal">关闭</button></div><input id="categoryOriginalId" type="hidden"><div class="field"><label>分类名称</label><input class="input" id="categoryName" required></div><div class="field"><label>分类 ID</label><input class="input" id="categoryId" pattern="[a-z0-9_-]+" required></div><div class="field"><label>图标或 Emoji</label><input class="input" id="categoryIcon" maxlength="8"></div><div class="modal-actions"><button class="btn" type="button" data-close="categoryModal">取消</button><button class="btn primary">保存</button></div></form></div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script>
(function(){
'use strict';
const DEFAULT_CREDENTIALS={user:'admin',pass:'admin123'};let data,report=[],pendingBookmarks=null;
const $=id=>document.getElementById(id);
function credentials(){try{return JSON.parse(localStorage.getItem('nav_admin_credentials'))||DEFAULT_CREDENTIALS}catch(e){return DEFAULT_CREDENTIALS}}
function showLogin(){$('loginPage').style.display='grid';$('adminPage').style.display='none'}
function showAdmin(){$('loginPage').style.display='none';$('adminPage').style.display='block';data=NavStore.load();renderAll();loadReport()}
function save(){data=NavStore.save(data);renderAll()}
function renderAll(){renderMetrics();fillCategorySelects();renderSites();renderCategories();renderSettings();renderLinks()}
function renderMetrics(){const statuses=countStatuses();$('metrics').innerHTML=metric(data.sites.length,'网站')+metric(data.categories.length,'分类')+metric(data.favorites.length,'收藏')+metric(statuses.active+statuses.redirect,'已验证')}
function metric(value,label){return '<div class="metric"><b>'+value+'</b><span>'+label+'</span></div>'}
function fillCategorySelects(){const opts=data.categories.slice().sort((a,b)=>a.order-b.order).map(c=>'<option value="'+c.id+'">'+esc(c.icon+' '+c.name)+'</option>').join('');$('siteCategory').innerHTML=opts;$('categoryFilter').innerHTML='<option value="">全部分类</option>'+opts}
function renderSites(){const q=$('siteFilter').value.toLowerCase(),cat=$('categoryFilter').value,cats=new Map(data.categories.map(c=>[c.id,c]));const sites=data.sites.filter(s=>(!q||(s.name+' '+s.url).toLowerCase().includes(q))&&(!cat||s.category===cat));$('sitesBody').innerHTML=sites.length?sites.map(s=>'<tr><td><div class="site-cell"><span class="mini-icon">'+esc(s.icon||domainInitial(s.url))+'</span><b>'+esc(s.name)+'</b></div></td><td>'+esc(cats.get(s.category)?.name||s.category)+'</td><td><div class="url" title="'+attr(s.url)+'">'+esc(s.url)+'</div></td><td>'+statusTag(s.status)+'</td><td><div class="row-actions"><button class="btn small" data-edit-site="'+s.id+'">编辑</button><button class="btn small danger" data-delete-site="'+s.id+'">删除</button></div></td></tr>').join(''):'<tr><td colspan="5" class="empty">没有网站</td></tr>';bindTableActions()}
function renderCategories(){const counts=new Map();data.sites.forEach(s=>counts.set(s.category,(counts.get(s.category)||0)+1));$('categoriesBody').innerHTML=data.categories.slice().sort((a,b)=>a.order-b.order).map(c=>'<tr><td>'+esc(c.icon)+'</td><td><b>'+esc(c.name)+'</b></td><td>'+esc(c.id)+'</td><td>'+ (counts.get(c.id)||0) +'</td><td><div class="row-actions"><button class="btn small" data-edit-cat="'+c.id+'">编辑</button><button class="btn small danger" data-delete-cat="'+c.id+'">删除</button></div></td></tr>').join('');bindTableActions()}
const settingLabels={showTime:'显示时间',showDate:'显示日期',showSeconds:'显示秒数',showSearch:'显示搜索框',showFavorites:'显示收藏入口',showThemeToggle:'显示主题切换',showStats:'显示网站统计',showDescriptions:'显示卡片描述'};
function renderSettings(){$('settingsGrid').innerHTML=Object.keys(settingLabels).map(k=>'<label class="toggle"><input type="checkbox" data-setting="'+k+'" '+(data.settings[k]?'checked':'')+'><span>'+settingLabels[k]+'</span></label>').join('')}
function countStatuses(){const out={active:0,redirect:0,review:0,dead:0,unchecked:0};data.sites.forEach(s=>out[s.status]++||null);return out}
function renderLinks(){const counts=countStatuses();$('linkMetrics').innerHTML=metric(counts.active,'有效')+metric(counts.redirect,'重定向')+metric(counts.review,'待复核')+metric(counts.dead,'失效');const f=$('statusFilter').value,byUrl=new Map(report.map(x=>[NavStore.normalizeUrl(x.url),x]));const rows=data.sites.filter(s=>!f||s.status===f);$('linksBody').innerHTML=rows.length?rows.map(s=>{const r=byUrl.get(NavStore.normalizeUrl(s.url))||{};return '<tr><td><b>'+esc(s.name)+'</b></td><td>'+statusTag(s.status)+'</td><td>'+esc(r.httpStatus||'—')+'</td><td><div class="url" title="'+attr(s.finalUrl||s.url)+'">'+esc(s.finalUrl||s.url)+'</div></td><td>'+esc(s.lastChecked||'—')+'</td><td>'+(s.finalUrl&&NavStore.normalizeUrl(s.finalUrl)!==NavStore.normalizeUrl(s.url)?'<button class="btn small" data-apply-url="'+s.id+'">采用最终网址</button>':'—')+'</td></tr>'}).join(''):'<tr><td colspan="6" class="empty">没有记录</td></tr>';bindTableActions()}
function statusTag(status){const labels={active:'有效',redirect:'重定向',review:'待复核',dead:'失效',unchecked:'未检测'};return '<span class="tag '+esc(status||'unchecked')+'">'+(labels[status]||'未检测')+'</span>'}
function bindTableActions(){document.querySelectorAll('[data-edit-site]').forEach(b=>b.onclick=()=>openSite(b.dataset.editSite));document.querySelectorAll('[data-delete-site]').forEach(b=>b.onclick=()=>deleteSite(b.dataset.deleteSite));document.querySelectorAll('[data-edit-cat]').forEach(b=>b.onclick=()=>openCategory(b.dataset.editCat));document.querySelectorAll('[data-delete-cat]').forEach(b=>b.onclick=()=>deleteCategory(b.dataset.deleteCat));document.querySelectorAll('[data-apply-url]').forEach(b=>b.onclick=()=>applyFinalUrl(b.dataset.applyUrl))}
function openSite(id){const s=data.sites.find(x=>x.id===id);$('siteModalTitle').textContent=s?'编辑网站':'新增网站';$('siteId').value=s?.id||'';$('siteName').value=s?.name||'';$('siteUrl').value=s?.url||'';$('siteIcon').value=s?.icon||'';$('siteCategory').value=s?.category||data.categories[0]?.id;$('siteStatus').value=s?.status||'unchecked';$('siteDesc').value=s?.desc||'';$('siteVisibility').checked=s?.visibility!==false;openModal('siteModal')}
function openCategory(id){const c=data.categories.find(x=>x.id===id);$('categoryModalTitle').textContent=c?'编辑分类':'新增分类';$('categoryOriginalId').value=c?.id||'';$('categoryId').value=c?.id||'';$('categoryId').disabled=!!c;$('categoryName').value=c?.name||'';$('categoryIcon').value=c?.icon||'';openModal('categoryModal')}
function deleteSite(id){if(!confirm('确定删除这个网站？'))return;data.sites=data.sites.filter(s=>s.id!==id);data.favorites=data.favorites.filter(x=>x!==id);save();toast('网站已删除')}
function deleteCategory(id){if(data.sites.some(s=>s.category===id)){toast('该分类仍有网站，不能删除');return}if(!confirm('确定删除这个分类？'))return;data.categories=data.categories.filter(c=>c.id!==id);save();toast('分类已删除')}
function applyFinalUrl(id){const s=data.sites.find(x=>x.id===id);if(!s||!s.finalUrl)return;s.url=s.finalUrl;s.status='active';save();toast('已采用最终网址')}
function openModal(id){$(id).classList.add('open')}function closeModal(id){$(id).classList.remove('open')}
function parseBookmarks(html){const doc=new DOMParser().parseFromString(html,'text/html'),folders=[...doc.querySelectorAll('h3')].map(h=>h.textContent.trim()).filter(Boolean),items=[...doc.querySelectorAll('a[href]')].map(a=>{let parent=a.parentElement,folder='未分类';while(parent){const heading=parent.querySelector(':scope > h3');if(heading){const name=heading.textContent.trim();folder=name==='书签栏'?'未分类':name;break}parent=parent.parentElement}return {name:a.textContent.trim()||a.href,url:a.getAttribute('href'),folder}});return {items,folders:[...new Set(folders)]}}
function prepareBookmarks(parsed){const existing=new Set(data.sites.map(s=>NavStore.normalizeUrl(s.url))),seen=new Set(),valid=[],duplicate=[];parsed.items.forEach(item=>{if(!/^https?:\/\//i.test(item.url)){return}const key=NavStore.normalizeUrl(item.url);if(existing.has(key)||seen.has(key))duplicate.push(item);else{seen.add(key);valid.push(item)}});return {folders:parsed.folders,valid,duplicate,skipped:parsed.items.length-valid.length-duplicate.length,total:parsed.items.length}}
function categoryFor(folder,url){const f=folder.toLowerCase();if(f.includes('ai'))return'ai';if(f.includes('机场')||f.includes('网络'))return'network';if(f.includes('ip'))return'ip';if(f.includes('电子书'))return'ebook';if(/journal|scholar/i.test(url))return'research';return'tool'}
function importPrepared(){if(!pendingBookmarks)return;pendingBookmarks.valid.forEach((x,i)=>data.sites.push({id:'import-'+Date.now()+'-'+i,name:x.name,url:x.url,desc:'从书签导入',icon:domainInitial(x.url),category:categoryFor(x.folder,x.url),status:'unchecked',finalUrl:x.url,lastChecked:'',source:'bookmark-import',visibility:true}));save();toast('已导入 '+pendingBookmarks.valid.length+' 个网站');pendingBookmarks=null;$('bookmarkPreview').style.display='none';$('bookmarkInput').value=''}
async function loadReport(){try{const response=await fetch('link-report.json',{cache:'no-store'});if(response.ok){report=await response.json();applyReport(report,false)}}catch(e){}}
function applyReport(rows,notify=true){if(!Array.isArray(rows))throw new Error('报告格式错误');report=rows;const byUrl=new Map(rows.map(x=>[NavStore.normalizeUrl(x.url),x]));data.sites.forEach(s=>{const r=byUrl.get(NavStore.normalizeUrl(s.url));if(!r)return;s.status=r.status||s.status;s.finalUrl=r.finalUrl||s.url;s.lastChecked=r.checkedAt||s.lastChecked});NavStore.save(data);renderAll();if(notify)toast('链接报告已导入')}
function exportData(){download('nav-data-v5-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(data,null,2),'application/json')}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function domainInitial(url){try{return new URL(url).hostname.replace(/^www\./,'')[0].toUpperCase()}catch{return'?'}}
function strip(v){const d=document.createElement('div');d.innerHTML=v;return d.textContent.trim()}function esc(v){const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML}function attr(v){return esc(v).replace(/"/g,'&quot;')}
function toast(message){$('toast').textContent=message;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
$('loginForm').onsubmit=e=>{e.preventDefault();const c=credentials();if($('loginUser').value===c.user&&$('loginPass').value===c.pass){sessionStorage.setItem('nav_admin_logged','true');showAdmin()}else $('loginError').textContent='账号或密码错误'};
$('logoutBtn').onclick=()=>{sessionStorage.removeItem('nav_admin_logged');showLogin()};
$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab-btn').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));$(b.dataset.tab+'Panel').classList.add('active')});
$('addSiteBtn').onclick=()=>openSite();$('addCategoryBtn').onclick=()=>openCategory();$('siteFilter').oninput=renderSites;$('categoryFilter').onchange=renderSites;$('statusFilter').onchange=renderLinks;
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));
$('siteForm').onsubmit=e=>{e.preventDefault();const id=$('siteId').value,duplicate=data.sites.find(s=>NavStore.normalizeUrl(s.url)===NavStore.normalizeUrl($('siteUrl').value)&&s.id!==id);if(duplicate){toast('该网址已存在');return}const item={id:id||'custom-'+Date.now(),name:$('siteName').value.trim(),url:$('siteUrl').value.trim(),desc:$('siteDesc').value.trim(),icon:$('siteIcon').value.trim(),category:$('siteCategory').value,status:$('siteStatus').value,finalUrl:$('siteUrl').value.trim(),lastChecked:'',source:id?(data.sites.find(s=>s.id===id)?.source||'custom'):'custom',visibility:$('siteVisibility').checked};if(id)data.sites[data.sites.findIndex(s=>s.id===id)]=Object.assign(data.sites.find(s=>s.id===id),item);else data.sites.push(item);save();closeModal('siteModal');toast('网站已保存')};
$('categoryForm').onsubmit=e=>{e.preventDefault();const original=$('categoryOriginalId').value,id=$('categoryId').value.trim();if(!original&&data.categories.some(c=>c.id===id)){toast('分类 ID 已存在');return}if(original){const c=data.categories.find(x=>x.id===original);c.name=$('categoryName').value.trim();c.icon=$('categoryIcon').value.trim()}else data.categories.push({id,name:$('categoryName').value.trim(),icon:$('categoryIcon').value.trim(),order:data.categories.length});save();closeModal('categoryModal');toast('分类已保存')};
$('saveSettingsBtn').onclick=()=>{document.querySelectorAll('[data-setting]').forEach(x=>data.settings[x.dataset.setting]=x.checked);save();toast('设置已保存')};
$('bookmarkInput').onchange=async e=>{const file=e.target.files[0];if(!file)return;pendingBookmarks=prepareBookmarks(parseBookmarks(await file.text()));$('bookmarkPreview').style.display='block';$('bookmarkPreview').innerHTML='<p><b>文件夹 '+pendingBookmarks.folders.length+'</b><b>网址 '+pendingBookmarks.total+'</b><b>新增 '+pendingBookmarks.valid.length+'</b><b>重复 '+pendingBookmarks.duplicate.length+'</b><b>跳过 '+pendingBookmarks.skipped+'</b></p><button class="btn primary" id="confirmBookmark">确认增量导入</button>';$('confirmBookmark').onclick=importPrepared};
$('reportInput').onchange=async e=>{try{applyReport(JSON.parse(await e.target.files[0].text()))}catch(err){toast('报告导入失败：'+err.message)}};
$('exportBtn').onclick=exportData;$('jsonInput').onchange=async e=>{try{data=NavStore.normalizeData(JSON.parse(await e.target.files[0].text()));save();toast('数据已导入')}catch(err){toast('数据导入失败：'+err.message)}};
$('resetBtn').onclick=()=>{if(confirm('确定恢复默认数据？当前修改将被覆盖。')){data=NavStore.reset();renderAll();toast('已恢复默认数据')}};
$('accountForm').onsubmit=e=>{e.preventDefault();localStorage.setItem('nav_admin_credentials',JSON.stringify({user:$('accountUser').value.trim(),pass:$('accountPass').value}));toast('管理员凭据已更新')};
const c=credentials();$('accountUser').value=c.user;
if(sessionStorage.getItem('nav_admin_logged')==='true')showAdmin();else showLogin();
})();
</script>
</body></html>
