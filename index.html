<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的工作台</title>
<link rel="stylesheet" href="style.css?v=20260627">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">W</div><div><strong>我的工作台</strong><small>常用网站导航</small></div></div>
    <nav class="nav-scroll" id="categoryNav"></nav>
    <div class="sidebar-foot"><a class="admin-link" href="admin.html">⚙ 后台管理</a></div>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" title="打开分类">☰</button>
      <div id="headerLabel">全部网站</div>
      <div class="clock" id="clock"><div class="clock-time" id="clockTime"></div><div class="clock-date" id="clockDate"></div></div>
      <button class="icon-btn" id="themeBtn" title="切换主题">◐</button>
    </header>
    <div class="content">
      <section class="search-panel" id="searchPanel">
        <select class="engine" id="engineSelect" aria-label="搜索引擎"></select>
        <div class="search-wrap"><input id="searchInput" type="search" placeholder="搜索网站或输入关键词" autocomplete="off"><button class="search-go" id="searchBtn" title="搜索">⌕</button></div>
      </section>
      <div class="summary"><div><h1 id="viewTitle">全部网站</h1><p id="viewSubtitle">按分类整理的个人工作入口</p></div><div class="stats" id="stats"></div></div>
      <section class="grid" id="siteGrid"></section>
    </div>
  </main>
</div>
<script src="data.js"></script>
<script src="merge-fix.js?v=20260627"></script>
<script src="app.js?v=20260627"></script>
</body>
</html>
